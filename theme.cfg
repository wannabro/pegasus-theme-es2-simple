version: 1.0
summary: ES2 Simple with game videos, favorites, console photos and system selection
description:
  An extended version of ES2 Simple, the port of the Simple theme of
  EmulationStation originally created by Nils Bonenberger. Adds game videos,
  a new layout and design, favorites, console photos, system selection,
  page up/down and gamepad/keyboard button hints.
keywords: es2, 10foot, video, favorites
homepage: https://github.com/wannabro/pegasus-theme-es2-simple
