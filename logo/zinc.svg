<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <!-- ZiNc: Sony ZN-1 / ZN-2 arcade board emulator. No official logo exists,
       so this is a simple wordmark in the style of the other logos. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa4ad"/>
      <stop offset="0.5" stop-color="#5d6770"/>
      <stop offset="1" stop-color="#2f363c"/>
    </linearGradient>
  </defs>
  <text x="300" y="140" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="150" letter-spacing="6" fill="url(#metal)"
        stroke="#1e2327" stroke-width="3">ZiNc</text>
  <rect x="95" y="160" width="410" height="6" fill="#c8102e"/>
  <text x="300" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="30" letter-spacing="8" fill="#2f363c">SONY ZN ARCADE</text>
</svg>
